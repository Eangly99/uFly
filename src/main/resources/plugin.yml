name: uFly
version: '${version}'
main: dev.naruto.uFly.UFlyPlugin
api-version: '1.21'
description: Plot-aware flight plugin powered by PlotSquared.
authors: [naruto]
soft-depend:
  - PlotSquared
  - CelestCombat-Pro
  - WorldGuard

commands:
  ufly:
    description: Toggle plot fly
    usage: /ufly
    permission: ufly.use

permissions:
  ufly.use:
    description: Base permission to toggle fly
    default: false
  ufly.claimed:
    description: Fly on owned plots
    default: false
  ufly.trust:
    description: Fly on trusted plots
    default: false
  ufly.all:
    description: Fly in entire plot world
    default: op
  ufly.admin:
    description: Admin commands (reload)
    default: op
