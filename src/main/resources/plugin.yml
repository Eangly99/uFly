name: uFly
version: ${version}
main: dev.naruto.uFly.UFlyPlugin
api-version: '1.21'
authors: [Eangly99]
description: A fly plugin with PlotSquared, WorldGuard and CelestCombat support.

commands:
  ufly:
    description: Toggle fly
    usage: /ufly [reload]
    permission: ufly.use

permissions:
  ufly.use:
    description: Allows the player to use /ufly
    default: op
  ufly.admin:
    description: Allows /ufly reload
    default: op
  ufly.bypass:
    description: Bypass all fly restrictions (world, combat, region, plot)
    default: op
  ufly.claimed:
    description: Allow fly on owned plots
    default: true
  ufly.trust:
    description: Allow fly on trusted/member plots
    default: true
  ufly.all:
    description: Allow fly anywhere in plot worlds
    default: false
